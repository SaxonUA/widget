<script>
  const MY_PLAYER_ID = 594760646;
  const WS_URL = "ws://localhost:38200";

  const mapEl    = document.getElementById("map-name");
  const damageEl = document.getElementById("damage-value");
  const assistEl = document.getElementById("assist-value");
  const killsEl  = document.getElementById("kills-value");

  const hpFill    = document.getElementById("hp-fill");
  const hpOverlay = document.getElementById("hp-overlay");

  let ws;
  let reconnectTimer;

  let totalDamage = 0;
  let totalAssist = 0;
  let totalKills  = 0;

  let maxHP = 0;
  let curHP = 0;

  // Щоб один і той самий знищений танк випадково
  // не зарахувався два рази
  let destroyedTargets = new Set();

  const fmt = n => Number(n).toLocaleString("uk-UA");
  const clamp = v => Math.max(0, Math.min(1, v));

  function updateHP(){
    hpOverlay.textContent = `${fmt(curHP)} / ${fmt(maxHP)}`;

    if (!maxHP){
      hpFill.style.width = "0%";
      return;
    }

    hpFill.style.width = `${clamp(curHP / maxHP) * 100}%`;
  }

  function resetAll(){
    totalDamage = 0;
    totalAssist = 0;
    totalKills = 0;

    maxHP = 0;
    curHP = 0;

    destroyedTargets.clear();

    mapEl.textContent = "-";
    damageEl.textContent = "0";
    assistEl.textContent = "0";
    killsEl.textContent = "0";

    updateHP();
  }

  function connectWS(){
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      clearTimeout(reconnectTimer);
      console.log("WotStat WebSocket connected");
    };

    ws.onclose = () => {
      reconnectTimer = setTimeout(connectWS, 1000);
    };

    ws.onerror = () => {
      ws.close();
    };

    ws.onmessage = handleMessage;
  }

  function handleState(path, value){

    switch(path){

      case "battle.arena":
        if (value?.localizedName){
          mapEl.textContent = value.localizedName;
        }
        break;


      case "battle.efficiency.assist":
        totalAssist = Number(value) || 0;
        assistEl.textContent = fmt(totalAssist);
        break;


      case "battle.maxHealth":
        maxHP = Number(value) || 0;
        updateHP();
        break;


      case "battle.health":
        curHP = Number(value) || 0;
        updateHP();
        break;


      case "hangar.isInHangar":
        document.body.style.display = value ? "none" : "flex";

        if (value){
          resetAll();
        }
        break;
    }
  }


  function handleTrigger(path, value){

    if (path !== "battle.onDamage") return;

    const attacker = value?.attacker;
    const target   = value?.target;

    if (!attacker) return;

    // Нас цікавить тільки шкода, нанесена саме нами
    if (Number(attacker.playerId) !== MY_PLAYER_ID) return;


    // ==========================
    // УРОН
    // ==========================

    const damage = Number(value?.damage) || 0;

    if (damage > 0){
      totalDamage += damage;
      damageEl.textContent = fmt(totalDamage);
    }


    // ==========================
    // ФРАГ
    // ==========================

    const targetHealth = Number(value?.health);

    if (target && targetHealth <= 0){

      // Унікальний ID цілі
      const targetKey =
        `${target.playerId ?? "0"}_${target.playerName ?? ""}_${target.tag ?? ""}`;

      // Не дозволяємо зарахувати одну ціль двічі
      if (!destroyedTargets.has(targetKey)){

        destroyedTargets.add(targetKey);

        totalKills++;

        killsEl.textContent = fmt(totalKills);

        console.log(
          "FRAG:",
          target.playerName,
          target.tag,
          "kills:",
          totalKills
        );
      }
    }
  }


  function handleMessage(e){

    try{

      const p = JSON.parse(e.data);

      if (!p?.type) return;


      // ==========================
      // INIT
      // ==========================
      // WotStat після підключення віддає
      // початкові значення всіх state.
      // У старому коді ти це взагалі ігнорував.

      if (p.type === "init" && Array.isArray(p.states)){

        for (const state of p.states){
          handleState(state.path, state.value);
        }

        return;
      }


      // ==========================
      // STATE
      // ==========================

      if (p.type === "state"){

        handleState(p.path, p.value);

        return;
      }


      // ==========================
      // TRIGGER
      // ==========================

      if (p.type === "trigger"){

        handleTrigger(p.path, p.value);

        return;
      }


    }catch(err){

      console.error("WotStat error:", err);

    }
  }


  updateHP();
  connectWS();
</script>
