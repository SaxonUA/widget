<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Віджет бою</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-color: rgba(0,0,0,0.0);
      --text-color:#ffffff;

      --hp-bg: rgba(0,0,0,0.35);
      --hp-border: rgba(255,255,255,0.18);
      --hp-fill: #20c76a;

      --widget-width: 360px;

      --stroke: rgba(0,0,0,0.90);
      --stroke-w: 1px;
    }

    body{
      margin:0;
      padding:10px;
      height:100vh;
      background:var(--bg-color);
      color:var(--text-color);
      display:flex;
      justify-content:flex-start;
      align-items:flex-start;
      font-family: "Roboto Condensed", Arial, sans-serif;
    }

    .battle-widget{
      width: var(--widget-width);
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap: 0.15rem;
      font-weight: 700;
    }

    .hp-section{
      width: 100%;
      margin-bottom: 0.1rem;
    }

    .hp-bar{
      width: 65%;
      height: 18px;
      position: relative;
      background: var(--hp-bg);
      border: 1px solid var(--hp-border);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.35);
      margin: 0;
    }

    .hp-fill{
      height: 100%;
      width: 0%;
      background: var(--hp-fill);
      transition: width 200ms linear;
    }

    .hp-overlay{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 16px;
      letter-spacing: .3px;
      color: rgba(255,255,255,0.98);
      user-select:none;
      white-space:nowrap;

      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;

      -webkit-text-stroke: var(--stroke-w) var(--stroke);
      paint-order: stroke fill;
      pointer-events:none;
    }

    .stat-block{
      display:flex;
      align-items:center;
      gap:.6rem;
      height: 32px;
    }

    .stat-label{
      width: 48px;
      flex: 0 0 48px;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow: visible;
    }

    .stat-label svg{
      width: 18px;
      height: 18px;
      display:block;
      fill: #ffffff;

      filter:
        drop-shadow(0 0 2px rgba(54,255,80,0.9))
        drop-shadow(0 0 5px rgba(54,255,80,0.5))
        drop-shadow(0 0 10px rgba(54,255,80,0.25));
    }

    .map-icon svg{
      width: 23px;
      height: 23px;
    }

    .damage-icon svg,
    .assist-icon svg,
    .kills-icon svg{
      width: 44px;
      height: 44px;
    }

    .stat-value{
      font-size: 20px;
      min-width: 90px;
      letter-spacing: .2px;
      color: rgba(255,255,255,0.98);

      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;

      -webkit-text-stroke: var(--stroke-w) var(--stroke);
      paint-order: stroke fill;
    }
  </style>
</head>

<body>

<script>

  // ============================================================
  // WOTSTAT
  // ============================================================

  const WS_URL = "ws://localhost:38200";


  // ============================================================
  // ELEMENTS
  // ============================================================

  const mapEl =
    document.getElementById("map-name");

  const damageEl =
    document.getElementById("damage-value");

  const assistEl =
    document.getElementById("assist-value");

  const killsEl =
    document.getElementById("kills-value");

  const hpFill =
    document.getElementById("hp-fill");

  const hpOverlay =
    document.getElementById("hp-overlay");


  // ============================================================
  // VARIABLES
  // ============================================================

  let ws = null;

  let reconnectTimer = null;

  let totalDamage = 0;

  let totalAssist = 0;

  let totalKills = 0;

  let maxHP = 0;

  let curHP = 0;

  let currentArenaId = null;


  // ============================================================
  // FORMAT
  // ============================================================

  const fmt = n =>
    Number(n || 0).toLocaleString("uk-UA");

  const clamp = v =>
    Math.max(0, Math.min(1, v));


  // ============================================================
  // HP
  // ============================================================

  function updateHP(){

    hpOverlay.textContent =
      `${fmt(curHP)} / ${fmt(maxHP)}`;

    if (!maxHP){

      hpFill.style.width = "0%";

      return;
    }

    const percent =
      clamp(curHP / maxHP) * 100;

    hpFill.style.width =
      `${percent}%`;
  }


  // ============================================================
  // KILLS STORAGE
  // ============================================================

  function getKillsStorageKey(){

    if (!currentArenaId){
      return null;
    }

    return `wot_battle_kills_${currentArenaId}`;
  }


  function saveKills(){

    const key =
      getKillsStorageKey();

    if (!key){
      return;
    }

    try{

      localStorage.setItem(
        key,
        String(totalKills)
      );

    }catch(e){}
  }


  function loadKills(){

    const key =
      getKillsStorageKey();

    if (!key){
      return;
    }

    try{

      const saved =
        localStorage.getItem(key);

      if (saved !== null){

        totalKills =
          Number(saved) || 0;

        killsEl.textContent =
          fmt(totalKills);
      }

    }catch(e){}
  }


  // ============================================================
  // RESET
  // ============================================================

  function resetAll(){

    totalDamage = 0;

    totalAssist = 0;

    totalKills = 0;

    maxHP = 0;

    curHP = 0;

    currentArenaId = null;

    mapEl.textContent = "-";

    damageEl.textContent = "0";

    assistEl.textContent = "0";

    killsEl.textContent = "0";

    updateHP();
  }


  // ============================================================
  // STATE
  // ============================================================

  function handleState(path, value){

    switch(path){


      // ========================================================
      // ARENA ID
      // ========================================================

      case "battle.arenaId":

        const newArenaId =
          value !== undefined &&
          value !== null
            ? String(value)
            : null;

        if (
          newArenaId &&
          newArenaId !== currentArenaId
        ){

          currentArenaId =
            newArenaId;

          totalKills = 0;

          killsEl.textContent = "0";

          loadKills();
        }

        break;


      // ========================================================
      // MAP
      // ========================================================

      case "battle.arena":

        if (value?.localizedName){

          mapEl.textContent =
            value.localizedName;
        }

        break;


      // ========================================================
      // DAMAGE
      // ========================================================

      case "battle.efficiency.damage":

        totalDamage =
          Number(value) || 0;

        damageEl.textContent =
          fmt(totalDamage);

        break;


      // ========================================================
      // ASSIST
      // ========================================================

      case "battle.efficiency.assist":

        totalAssist =
          Number(value) || 0;

        assistEl.textContent =
          fmt(totalAssist);

        break;


      // ========================================================
      // MAX HP
      // ========================================================

      case "battle.maxHealth":

        maxHP =
          Number(value) || 0;

        updateHP();

        break;


      // ========================================================
      // CURRENT HP
      // ========================================================

      case "battle.health":

        curHP =
          Number(value) || 0;

        updateHP();

        break;


      // ========================================================
      // HANGAR
      // ========================================================

      case "hangar.isInHangar":

        document.body.style.display =
          value
            ? "none"
            : "flex";

        if (value){

          resetAll();
        }

        break;
    }
  }


  // ============================================================
  // PLAYER FEEDBACK
  // ============================================================

  function handlePlayerFeedback(value){

    console.log(
      "[WOTSTAT] PlayerFeedback:",
      value
    );

    if (!value){
      return;
    }


    // ==========================================================
    // KILL
    // ==========================================================

    if (value.type === "kill"){

      totalKills++;

      killsEl.textContent =
        fmt(totalKills);

      saveKills();

      console.log(
        "[WOTSTAT] KILL +1",
        "TOTAL:",
        totalKills,
        "TARGET:",
        value?.data?.vehicle?.playerName ||
        value?.data?.vehicle?.localizedName ||
        value?.data?.vehicle?.tag ||
        "unknown"
      );
    }
  }


  // ============================================================
  // TRIGGER
  // ============================================================

  function handleTrigger(path, value){

    console.log(
      "[WOTSTAT] TRIGGER:",
      path,
      value
    );


    // ==========================================================
    // PLAYER FEEDBACK
    // ==========================================================

    if (
      path ===
      "battle.onPlayerFeedback"
    ){

      handlePlayerFeedback(value);

      return;
    }
  }


  // ============================================================
  // MESSAGE
  // ============================================================

  function handleMessage(event){

    try{

      const packet =
        JSON.parse(event.data);


      // ========================================================
      // INIT
      // ========================================================

      if (
        packet.type === "init" &&
        Array.isArray(packet.states)
      ){

        console.log(
          "[WOTSTAT] INIT",
          packet.states
        );


        /*
          Спочатку arenaId,
          щоб правильно відновити фраги
          після перезавантаження OBS.
        */

        const arenaState =
          packet.states.find(
            state =>
              state.path ===
              "battle.arenaId"
          );

        if (arenaState){

          handleState(
            arenaState.path,
            arenaState.value
          );
        }


        /*
          Потім усі інші значення
        */

        for (
          const state
          of packet.states
        ){

          if (
            state.path ===
            "battle.arenaId"
          ){
            continue;
          }

          handleState(
            state.path,
            state.value
          );
        }

        return;
      }


      // ========================================================
      // STATE
      // ========================================================

      if (
        packet.type === "state"
      ){

        handleState(
          packet.path,
          packet.value
        );

        return;
      }


      // ========================================================
      // TRIGGER
      // ========================================================

      if (
        packet.type === "trigger"
      ){

        handleTrigger(
          packet.path,
          packet.value
        );

        return;
      }


    }catch(error){

      console.error(
        "[WOTSTAT] ERROR:",
        error,
        event.data
      );
    }
  }


  // ============================================================
  // WEBSOCKET
  // ============================================================

  function connectWS(){

    if (
      ws &&
      (
        ws.readyState ===
        WebSocket.OPEN ||

        ws.readyState ===
        WebSocket.CONNECTING
      )
    ){
      return;
    }


    console.log(
      "[WOTSTAT] Connecting..."
    );


    ws =
      new WebSocket(
        WS_URL
      );


    // ==========================================================
    // OPEN
    // ==========================================================

    ws.onopen = () => {

      console.log(
        "[WOTSTAT] Connected"
      );

      clearTimeout(
        reconnectTimer
      );
    };


    // ==========================================================
    // MESSAGE
    // ==========================================================

    ws.onmessage =
      handleMessage;


    // ==========================================================
    // ERROR
    // ==========================================================

    ws.onerror = error => {

      console.error(
        "[WOTSTAT] WebSocket error:",
        error
      );
    };


    // ==========================================================
    // CLOSE
    // ==========================================================

    ws.onclose = () => {

      console.log(
        "[WOTSTAT] Disconnected"
      );

      clearTimeout(
        reconnectTimer
      );

      reconnectTimer =
        setTimeout(
          connectWS,
          1000
        );
    };
  }


  // ============================================================
  // START
  // ============================================================

  updateHP();

  connectWS();

</script>
